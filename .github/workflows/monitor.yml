name: X Mercari Monitor

on:
  schedule:
    - cron: '3-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: x-mercari-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Run one check
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_2: ${{ secrets.DISCORD_WEBHOOK_URL_2 }}
          MERCARI_AFID: ${{ secrets.MERCARI_AFID }}
        run: python monitor.py

      - name: Persist monitor state
        run: |
          if [ -f monitor_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add monitor_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update monitor checkpoint [skip ci]"
              git push
            fi
          fi
